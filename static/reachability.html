<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kappa Reachability Explorer</title>

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        #header {
            background: #252526;
            padding: 10px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #cccccc;
            margin-right: 20px;
        }

        #file-selector {
            padding: 6px 12px;
            background: #3c3c3c;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #cccccc;
            font-size: 14px;
            cursor: pointer;
        }

        #file-selector:hover {
            background: #454545;
        }

        #help-text {
            margin-left: auto;
            font-size: 12px;
            color: #808080;
        }

        #container {
            display: flex;
            height: calc(100vh - 50px);
        }

        #editor-pane {
            width: 100%;
            background: #1e1e1e;
            position: relative;
        }

        .CodeMirror {
            height: 100% !important;
            font-size: 14px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        /* Cursor line highlight (visual mode) */
        .cursor-line {
            background-color: rgba(100, 100, 255, 0.2) !important;
        }

        /* Source line highlight */
        .source-line {
            background-color: rgba(255, 200, 0, 0.3) !important;
        }

        /* Destination line highlight */
        .destination-line {
            background-color: rgba(255, 100, 200, 0.3) !important;
        }

        /* Reachable line highlight */
        .reachable-line {
            background-color: rgba(0, 255, 100, 0.3) !important;
        }

        /* Source + Reachable (both) */
        .source-reachable-line {
            background: linear-gradient(90deg,
                rgba(255, 200, 0, 0.4) 0%,
                rgba(255, 200, 0, 0.4) 50%,
                rgba(0, 255, 100, 0.4) 50%,
                rgba(0, 255, 100, 0.4) 100%) !important;
        }

        /* Destination + Reachable (both) */
        .destination-reachable-line {
            background: linear-gradient(90deg,
                rgba(255, 100, 200, 0.4) 0%,
                rgba(255, 100, 200, 0.4) 50%,
                rgba(0, 255, 100, 0.4) 50%,
                rgba(0, 255, 100, 0.4) 100%) !important;
        }

        /* Mark gutters */
        .mark-gutter {
            width: 20px !important;
            font-size: 10px;
            color: #ffffff;
            font-weight: bold;
        }

        #status-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #252526;
            border-top: 1px solid #3e3e42;
            padding: 6px 12px;
            font-size: 12px;
            color: #cccccc;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-left: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-box {
            width: 16px;
            height: 16px;
            border: 1px solid #5a5a5a;
        }

        .legend-source {
            background-color: rgba(255, 200, 0, 0.5);
        }

        .legend-destination {
            background-color: rgba(255, 100, 200, 0.5);
        }

        .legend-reachable {
            background-color: rgba(0, 255, 100, 0.5);
        }

        .legend-cursor {
            background-color: rgba(100, 100, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Causal Graph Pathfinding</h1>
        <select id="file-selector">
            <option value="">Select a .ka file...</option>
        </select>
        <span id="help-text">j/k: navigate | s: mark source | d: mark destination | u: unmark</span>
    </div>

    <div id="container">
        <div id="editor-pane">
            <textarea id="ka-editor"></textarea>
            <div id="status-bar">
                <span id="cursor-info">Line 1, Col 1</span>
                <span class="legend">
                    <span class="legend-item">
                        <span class="legend-box legend-cursor"></span>
                        <span>Cursor</span>
                    </span>
                    <span class="legend-item">
                        <span class="legend-box legend-source"></span>
                        <span>Source (S)</span>
                    </span>
                    <span class="legend-item">
                        <span class="legend-box legend-destination"></span>
                        <span>Destination (D)</span>
                    </span>
                    <span class="legend-item">
                        <span class="legend-box legend-reachable"></span>
                        <span>Reachable</span>
                    </span>
                </span>
            </div>
        </div>
    </div>

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>

    <script>
        // Initialize CodeMirror
        const editor = CodeMirror.fromTextArea(document.getElementById('ka-editor'), {
            lineNumbers: true,
            readOnly: true,
            theme: 'monokai',
            lineWrapping: false,
            gutters: ["mark-gutter", "CodeMirror-linenumbers"],
            cursorBlinkRate: 530  // Vim-like cursor blinking
        });

        // State
        let sourceLines = new Set();
        let destinationLines = new Set();
        let reachableLines = new Set();
        let currentCursorLine = 0;
        let isLoadingFile = false;
        let currentFileName = null;

        // Update cursor line highlight
        function updateCursorHighlight(newLine) {
            // Remove old cursor highlight
            if (currentCursorLine !== null) {
                editor.removeLineClass(currentCursorLine, 'background', 'cursor-line');
            }

            // Add new cursor highlight
            currentCursorLine = newLine;
            editor.addLineClass(newLine, 'background', 'cursor-line');

            // Update status bar
            const lineNum = newLine + 1;
            const cursor = editor.getCursor();
            document.getElementById('cursor-info').textContent = `Line ${lineNum}, Col ${cursor.ch + 1}`;
        }

        // Update all line highlights and gutter markers
        function updateAllHighlights() {
            const lineCount = editor.lineCount();

            for (let i = 0; i < lineCount; i++) {
                const lineNum = i + 1;
                const isSource = sourceLines.has(lineNum);
                const isDestination = destinationLines.has(lineNum);
                const isReachable = reachableLines.has(lineNum);

                // Remove all highlight classes
                editor.removeLineClass(i, 'background', 'source-line');
                editor.removeLineClass(i, 'background', 'destination-line');
                editor.removeLineClass(i, 'background', 'reachable-line');
                editor.removeLineClass(i, 'background', 'source-reachable-line');
                editor.removeLineClass(i, 'background', 'destination-reachable-line');

                // Apply appropriate highlight
                if (isSource && isReachable) {
                    editor.addLineClass(i, 'background', 'source-reachable-line');
                } else if (isDestination && isReachable) {
                    editor.addLineClass(i, 'background', 'destination-reachable-line');
                } else if (isSource) {
                    editor.addLineClass(i, 'background', 'source-line');
                } else if (isDestination) {
                    editor.addLineClass(i, 'background', 'destination-line');
                } else if (isReachable) {
                    editor.addLineClass(i, 'background', 'reachable-line');
                }

                // Update gutter marker
                editor.setGutterMarker(i, "mark-gutter", null);
                if (isSource) {
                    const marker = document.createElement("div");
                    marker.className = "mark-gutter";
                    marker.textContent = "S";
                    marker.style.color = "#ffc800";
                    editor.setGutterMarker(i, "mark-gutter", marker);
                } else if (isDestination) {
                    const marker = document.createElement("div");
                    marker.className = "mark-gutter";
                    marker.textContent = "D";
                    marker.style.color = "#ff64c8";
                    editor.setGutterMarker(i, "mark-gutter", marker);
                }
            }

            // Re-apply cursor highlight on top
            if (currentCursorLine !== null) {
                editor.addLineClass(currentCursorLine, 'background', 'cursor-line');
            }
        }

        // Mark current line as source
        async function markSource() {
            const cursor = editor.getCursor();
            const lineNum = cursor.line + 1;

            try {
                const response = await fetch('/api/mark_source', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ line_num: lineNum })
                });

                const data = await response.json();

                if (data.error) {
                    console.error('Error marking source:', data.error);
                    return;
                }

                // Update state
                sourceLines = new Set(data.source_lines);
                destinationLines = new Set(data.destination_lines);
                reachableLines = new Set(Object.keys(data.reachable_lines).map(Number));

                // Update highlights
                updateAllHighlights();

                // Move cursor down
                const newLine = Math.min(cursor.line + 1, editor.lineCount() - 1);
                editor.setCursor({ line: newLine, ch: cursor.ch });
                updateCursorHighlight(newLine);
            } catch (error) {
                console.error('Error marking source:', error);
            }
        }

        // Mark current line as destination
        async function markDestination() {
            const cursor = editor.getCursor();
            const lineNum = cursor.line + 1;

            try {
                const response = await fetch('/api/mark_destination', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ line_num: lineNum })
                });

                const data = await response.json();

                if (data.error) {
                    console.error('Error marking destination:', data.error);
                    return;
                }

                // Update state
                sourceLines = new Set(data.source_lines);
                destinationLines = new Set(data.destination_lines);
                reachableLines = new Set(Object.keys(data.reachable_lines).map(Number));

                // Update highlights
                updateAllHighlights();

                // Move cursor down
                const newLine = Math.min(cursor.line + 1, editor.lineCount() - 1);
                editor.setCursor({ line: newLine, ch: cursor.ch });
                updateCursorHighlight(newLine);
            } catch (error) {
                console.error('Error marking destination:', error);
            }
        }

        // Unmark current line (both source and destination)
        async function unmarkLine() {
            const cursor = editor.getCursor();
            const lineNum = cursor.line + 1;

            // Determine which type to unmark
            const isSource = sourceLines.has(lineNum);
            const isDestination = destinationLines.has(lineNum);

            if (!isSource && !isDestination) {
                // Nothing to unmark, just move cursor down
                const newLine = Math.min(cursor.line + 1, editor.lineCount() - 1);
                editor.setCursor({ line: newLine, ch: cursor.ch });
                updateCursorHighlight(newLine);
                return;
            }

            try {
                const endpoint = isSource ? '/api/unmark_source' : '/api/unmark_destination';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ line_num: lineNum })
                });

                const data = await response.json();

                if (data.error) {
                    console.error('Error unmarking:', data.error);
                    return;
                }

                // Update state
                sourceLines = new Set(data.source_lines);
                destinationLines = new Set(data.destination_lines);
                reachableLines = new Set(Object.keys(data.reachable_lines).map(Number));

                // Update highlights
                updateAllHighlights();

                // Move cursor down
                const newLine = Math.min(cursor.line + 1, editor.lineCount() - 1);
                editor.setCursor({ line: newLine, ch: cursor.ch });
                updateCursorHighlight(newLine);
            } catch (error) {
                console.error('Error unmarking:', error);
            }
        }

        // Handle keyboard navigation
        editor.on('keydown', (cm, event) => {
            const cursor = cm.getCursor();

            if (event.key === 'j') {
                // Move down
                event.preventDefault();
                const newLine = Math.min(cursor.line + 1, cm.lineCount() - 1);
                cm.setCursor({ line: newLine, ch: cursor.ch });
                updateCursorHighlight(newLine);
            } else if (event.key === 'k') {
                // Move up
                event.preventDefault();
                const newLine = Math.max(cursor.line - 1, 0);
                cm.setCursor({ line: newLine, ch: cursor.ch });
                updateCursorHighlight(newLine);
            } else if (event.key === 'h') {
                // Move left
                event.preventDefault();
                const newCh = Math.max(cursor.ch - 1, 0);
                cm.setCursor({ line: cursor.line, ch: newCh });
            } else if (event.key === 'l') {
                // Move right
                event.preventDefault();
                const lineLength = cm.getLine(cursor.line).length;
                const newCh = Math.min(cursor.ch + 1, lineLength);
                cm.setCursor({ line: cursor.line, ch: newCh });
            } else if (event.key === 's') {
                // Mark line as source
                event.preventDefault();
                markSource();
            } else if (event.key === 'd') {
                // Mark line as destination
                event.preventDefault();
                markDestination();
            } else if (event.key === 'u') {
                // Unmark line
                event.preventDefault();
                unmarkLine();
            } else if (event.key === 'g') {
                // Go to top (gg)
                event.preventDefault();
                cm.setCursor({ line: 0, ch: 0 });
                updateCursorHighlight(0);
            } else if (event.key === 'G') {
                // Go to bottom
                event.preventDefault();
                const lastLine = cm.lineCount() - 1;
                cm.setCursor({ line: lastLine, ch: 0 });
                updateCursorHighlight(lastLine);
            }
        });

        // Track cursor movement
        editor.on('cursorActivity', (cm) => {
            const cursor = cm.getCursor();
            updateCursorHighlight(cursor.line);
        });

        // Load available files
        async function loadFileList() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();

                const selector = document.getElementById('file-selector');
                selector.innerHTML = '<option value="">Select a .ka file...</option>';

                data.files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = JSON.stringify(file);
                    option.textContent = file.display_name;
                    selector.appendChild(option);
                });

                // Auto-load simple.ka if it exists, otherwise the first file
                if (data.files.length > 0 && !currentFileName) {
                    // Look for simple.ka
                    let fileToLoad = data.files.find(f => f.ka_file === 'simple.ka');
                    // Fall back to first file if simple.ka not found
                    if (!fileToLoad) {
                        fileToLoad = data.files[0];
                    }
                    selector.value = JSON.stringify(fileToLoad);
                    await loadFile(fileToLoad);
                }
            } catch (error) {
                console.error('Error loading file list:', error);
            }
        }

        // Load a specific file
        async function loadFile(fileInfo) {
            // Prevent duplicate loads
            if (isLoadingFile) {
                return;
            }

            // Skip if already loaded
            if (currentFileName === fileInfo.ka_file) {
                return;
            }

            isLoadingFile = true;

            try {
                const response = await fetch('/api/load', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fileInfo)
                });

                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                // Set editor content
                editor.setValue(data.content);

                // Reset state
                sourceLines = new Set();
                destinationLines = new Set();
                reachableLines = new Set();
                currentFileName = fileInfo.ka_file;

                // Initialize cursor
                editor.setCursor({ line: 0, ch: 0 });
                updateCursorHighlight(0);

                // Update highlights
                updateAllHighlights();
            } catch (error) {
                console.error('Error loading file:', error);
                alert('Error loading file: ' + error.message);
            } finally {
                isLoadingFile = false;
            }
        }

        // File selector change handler
        document.getElementById('file-selector').addEventListener('change', (e) => {
            const value = e.target.value;
            if (value) {
                const fileInfo = JSON.parse(value);
                loadFile(fileInfo);
            }
        });

        // Initialize
        loadFileList();
    </script>
</body>
</html>
